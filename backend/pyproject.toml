[project]
name = "lexis-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "PIE", "A"]
ignore = [
  "B008", # FastAPI's Depends()/File() in default arguments is the documented pattern
  "E501", # long text strings cannot be wrapped; `ruff format` handles the code
]
